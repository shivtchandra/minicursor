[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-mcp"
version = "0.3.1"
description = "Token-frugal MCP tools for Claude Code, Cursor, and Codex — repo map, ranged reads, surgical patching, session parking."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "claude", "cursor", "codex", "agent", "llm", "token-efficiency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB/mini-mcp"
Repository = "https://github.com/YOUR_GITHUB/mini-mcp"
Issues = "https://github.com/YOUR_GITHUB/mini-mcp/issues"

[project.scripts]
mini-mcp = "mini_mcp:main_entry"

[tool.hatch.build.targets.wheel]
packages = ["mini_mcp"]
